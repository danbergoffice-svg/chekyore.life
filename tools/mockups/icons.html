<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Варианты значков</title>
<style>
  body { margin: 0; background: #16213a; color: #f3ead7; font: 16px/1.4 Georgia, serif; padding: 24px; width: 980px; }
  h2 { font-size: 20px; margin: 22px 0 4px; color: #e7c46a; letter-spacing: 1px; text-transform: uppercase; }
  p { margin: 0 0 10px; color: #b9b2a0; font-size: 14px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .cell { width: 60px; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: #8d93a8; }
  .ic { width: 40px; height: 40px; }
  .ctx { display: flex; gap: 18px; margin-top: 10px; align-items: center; }
  .btn { background: #f3ead7; color: #1b1a17; font-weight: bold; padding: 10px 18px; display: flex; gap: 8px; align-items: center; clip-path: polygon(0 4%, 100% 0, 99% 100%, 1% 96%); }
  .btn .ic { width: 22px; height: 22px; }
  .days { display: flex; gap: 6px; }
  .day { width: 44px; height: 52px; border: 1px solid #34436a; border-radius: 6px; background: #1d2a48; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; color: #8d93a8; }
  .day .ic { width: 26px; height: 26px; }
  .day.on { border-color: #e7c46a; }
  .goal { display: flex; gap: 10px; align-items: center; background: #121a2e; border: 1px solid #2b3858; border-radius: 8px; padding: 8px 12px; }
  .goal .ic { width: 26px; height: 26px; }
  .box { border-top: 1px solid #2b3858; padding-top: 6px; margin-top: 14px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { ICONS, iconRects, iconSize } from '/src/ui/icons.ts'

// Общие контуры 24×24: s - линия, f - замкнутая фигура
const P = {
  gift: [['f', 'M4 10h16v10.5H4z'], ['f', 'M3 7h18v3.5H3z'], ['s', 'M12 7v13.5'], ['f', 'M12 7C10 3.5 6.5 3.5 6.5 5.5S9.5 7 12 7z'], ['f', 'M12 7c2-3.5 5.5-3.5 5.5-1.5S14.5 7 12 7z']],
  crown: [['f', 'M3.5 17.5 5 7.5l4.5 4.5L12 5l2.5 7 4.5-4.5 1.5 10z'], ['f', 'M3.5 19h17v2h-17z']],
  heart: [['f', 'M12 20.5C5 15.5 2.5 12 3.5 8 4.5 4.5 9 3.5 12 7.5c3-4 7.5-3 8.5.5 1 4-1.5 7.5-8.5 12.5z']],
  castle: [['f', 'M4 21V9h2.2V6.5h2.3V9h2.3V6.5h2.4V9h2.3V6.5h2.3V9H20v12h-5.5v-4.5a2.5 2.5 0 0 0-5 0V21z']],
  moon: [['f', 'M15.5 3.2A8.8 8.8 0 1 0 20.8 15 7 7 0 0 1 15.5 3.2z']],
  purse: [['f', 'M8.5 8.8c-4 2.6-5.4 6.4-4.3 9.2.8 2.2 3.6 3 7.8 3s7-.8 7.8-3c1.1-2.8-.3-6.6-4.3-9.2z'], ['f', 'M8 4.5c1.4 1 2.6 1.4 4 1.4s2.6-.4 4-1.4l-1.2 4.3H9.2z'], ['s', 'M12 13v5M10.2 14.2c0-1 3.6-1 3.6.4s-3.6 1-3.6 2.4 3.6 1.4 3.6.4']],
  target: [['s', 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10z'], ['f', 'M12 10.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z']],
  lock: [['s', 'M8 10.5V7.5a4 4 0 0 1 8 0v3'], ['f', 'M5 10.5h14v10.5H5z'], ['s', 'M12 14.3v3']],
  video: [['f', 'M3 5.5h18v13H3z'], ['f', 'M10 9l5 3-5 3z', 'acc']],
  hourglass: [['s', 'M6 3h12M6 21h12'], ['f', 'M7.5 3.5c0 5 4.5 6.5 4.5 8.5s-4.5 3.5-4.5 8.5h9c0-5-4.5-6.5-4.5-8.5s4.5-3.5 4.5-8.5z']],
  book: [['f', 'M12 6.5C9.5 4.8 6 4.6 3 5.3v13.4c3-.7 6.5-.4 9 1.3 2.5-1.7 6-2 9-1.3V5.3c-3-.7-6.5-.5-9 1.2z'], ['s', 'M12 6.5V20']],
  person: [['f', 'M12 3.8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z'], ['f', 'M4.5 21c.4-4.3 3.6-6.8 7.5-6.8s7.1 2.5 7.5 6.8z']],
}
const NAMES = Object.keys(P)
const RU = { gift: 'дар', crown: 'корона', heart: 'сердце', castle: 'замок', moon: 'луна', purse: 'кошель', target: 'цель', lock: 'замок', video: 'реклама', hourglass: 'часы', book: 'книга', person: 'игрок' }

const svg = (inner, defs = '') => `<svg class="ic" viewBox="0 0 24 24">${defs}${inner}</svg>`

// Сейчас: пиксели 9×9
function pixel(n) {
  const [w, h] = iconSize(n)
  const r = iconRects(n).map((q) => `<rect x="${q.x}" y="${q.y}" width="${q.w}" height="1" fill="${q.fill.replace(/var\([^,]+, ?([^)]+)\)/, '$1').replace('currentColor', '#f3ead7')}"/>`).join('')
  return `<svg class="ic" viewBox="-1 -1 ${Math.max(w, h) + 2} ${Math.max(w, h) + 2}" shape-rendering="crispEdges" style="color:#f3ead7">${r}</svg>`
}

// А. Линия: тонкий контур латунью, как значки на карте
function line(n) {
  return svg(P[n].map(([k, d, acc]) => `<path d="${d}" fill="${k === 'f' && acc ? '#d9573c' : 'none'}" stroke="${acc ? '#d9573c' : '#e7c46a'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`).join(''))
}

// Б. Гравюра: заливка латунью с тёмным контуром и бликом - как печать или жетон
let gid = 0
function engraved(n) {
  const id = 'g' + gid++
  const defs = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset=".55" stop-color="#d9a84a"/><stop offset="1" stop-color="#9c6a22"/></linearGradient></defs>`
  return svg(P[n].map(([k, d, acc]) => k === 'f'
    ? `<path d="${d}" fill="${acc ? '#d9573c' : `url(#${id})`}" stroke="#2a1a08" stroke-width="1.1" stroke-linejoin="round"/>`
    : `<path d="${d}" fill="none" stroke="#2a1a08" stroke-width="2.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#${id})" stroke-width="1.3" stroke-linecap="round"/>`).join(''), defs)
}

// В. Эмаль: значок-медальон в латунном ободе, как лампы и таблички барабана
function enamel(n) {
  const id = 'e' + gid++
  const defs = `<defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#3d5a9e"/><stop offset="1" stop-color="#1a2852"/></radialGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset="1" stop-color="#a87628"/></linearGradient></defs>`
  const inner = P[n].map(([k, d, acc]) => k === 'f'
    ? `<path d="${d}" fill="${acc ? '#d9573c' : '#f3ead7'}"/>`
    : `<path d="${d}" fill="none" stroke="#f3ead7" stroke-width="1.8" stroke-linecap="round"/>`).join('')
  return `<svg class="ic" viewBox="-4 -4 32 32">${defs}<circle cx="12" cy="12" r="15" fill="url(#${id}b)"/><circle cx="12" cy="12" r="13" fill="url(#${id})"/><g transform="translate(12 12) scale(.72) translate(-12 -12)">${inner}</g></svg>`
}

const STYLES = [
  ['Сейчас - пиксели', 'Клетки 9×9: на маленьком размере «лесенка», мелкие детали теряются.', (n) => (ICONS[n] ? pixel(n) : '')],
  ['А. Линия', 'Тонкий латунный контур, как пометки на старой карте. Легкие, не спорят с текстом, хорошо видны в кнопках.', line],
  ['Б. Гравюра', 'Плотный силуэт, латунь с бликом и тёмный контур - как печать или жетон. Ярче всего на тёмном фоне.', engraved],
  ['В. Эмаль', 'Медальон: синяя эмаль в латунном ободе, как лампы барабана. Самые нарядные, но крупнее и тяжелее.', enamel],
]
const DAYS = ['gift', 'purse', 'heart', 'castle', 'moon', 'book', 'crown']

document.getElementById('out').innerHTML = STYLES.map(([title, note, f]) => `
  <div class="box"><h2>${title}</h2><p>${note}</p>
  <div class="row">${NAMES.map((n) => `<div class="cell">${f(n)}<span>${RU[n]}</span></div>`).join('')}</div>
  <div class="ctx">
    <div class="btn">${f('gift')}Забрать дар дня 1</div>
    <div class="days">${DAYS.map((n, i) => `<div class="day${i === 0 ? ' on' : ''}">${f(n)}${i + 1}</div>`).join('')}</div>
    <div class="goal">${f('target')}<b>Махаут</b></div>
  </div></div>`).join('')
</script>
</body>
</html>
