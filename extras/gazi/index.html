    history: { tr: "Genelge 22 Haziran 1919'da Amasya'da imzalandı. İstanbul hükûmetinin ülkeyi koruyamadığı ilk kez açıkça yazıldı.", en: "The circular was signed in Amasya on 22 June 1919. It said openly for the first time that the Istanbul government could not defend the country." } },

  { date: { tr: "Temmuz 1919", en: "July 1919" }, title: { tr: "Üniforma mı, vatan mı", en: "The uniform or the nation" }, photo: "erzurum",
    text: { tr: "İstanbul sizi geri çağırıyor ve yetkilerinizi alıyor. İngilizler tutuklanmanızı istiyor. Boyun eğerseniz hareket lidersiz kalır.", en: "Istanbul recalls you and strips your authority. The British demand your arrest. If you obey, the movement loses its leader." },
    options: [
      { t: { tr: "Ordudan istifa et, mücadeleye bir sivil olarak devam et", en: "Resign from the army and carry on as a civilian" }, d: { tr: "Emre değil, millete dayan", en: "Rely on the nation, not on orders" }, ok: true, fx: { morale: 10, people: 10 },
        r: { tr: "8 Temmuz gecesi üniformanızı çıkarıyorsunuz. Kâzım Karabekir ve Ali Fuat Paşa sizi lider tanıyor.", en: "On the night of 8 July you take off your uniform. Kâzım Karabekir and Ali Fuat Pasha accept you as their leader." } },
      { t: { tr: "Emre uy ve geri dön", en: "Obey the order and go back" }, d: { tr: "Rütbeni ve kariyerini koru", en: "Keep your rank and career" }, fx: { morale: -20, people: -10 },
        r: { tr: "Erzurum'a kadar gidiyorsunuz, ama subaylar kalmanız için yalvarıyor. Zaman ve güven kaybedildi.", en: "You get as far as Erzurum before the officers beg you to stay. Time and trust have been lost." } },
    ],
    history: { tr: "İstifa 8 Temmuz 1919 tarihlidir. Mustafa Kemal mücadeleye «milletin bir ferdi olarak» devam edeceğini söyledi.", en: "The resignation is dated 8 July 1919. Mustafa Kemal said he would fight on \"as one of the nation's sons\"." } },

  { date: { tr: "Temmuz – Eylül 1919", en: "July – Sept 1919" }, title: { tr: "Kongreler", en: "The congresses" }, type: "map", photo: "sivas",
    text: { tr: "Bütün ülkenin temsilcilerini toplamak ve ortak bir program çıkarmak gerekiyor. Kongrelerin nerede toplanacağını haritada seçin.", en: "You need to gather delegates from the whole country and agree a common programme. Pick on the map where the congresses meet." },
    need: ["erzurum", "sivas"],
    targets: {
      erzurum: { r: { tr: "Erzurum Kongresi (23 Temmuz – 7 Ağustos): vatan bölünmez, manda ve himaye kabul edilemez.", en: "The Erzurum Congress (23 July – 7 August): the homeland is indivisible, no mandate or protectorate is acceptable." }, fx: { people: 10, morale: 5 } },
      sivas:   { r: { tr: "Sivas Kongresi (4–11 Eylül) bütün Müdafaa-i Hukuk cemiyetlerini birleştiriyor. Heyet-i Temsiliye başkanı seçiliyorsunuz.", en: "The Sivas Congress (4–11 September) unites all the Defence of Rights societies. You are elected head of the Representative Committee." }, fx: { people: 10, morale: 5 } },
      izmir:   { r: { tr: "Ordusuz bir saldırı Yunan kolordusuna karşı katliam olur. Gönüllüler dağılıyor.", en: "Attacking a Greek corps without an army is a massacre. The volunteers scatter." }, fx: { army: -10, morale: -10 } },
    },
    history: { tr: "Kongre kararları, 28 Ocak 1920'de kabul edilen Misak-ı Millî'nin temeli oldu. Sonraki üç yıl bu harita için savaşıldı.", en: "The congresses' decisions became the basis of the National Pact (Misak-ı Millî), adopted on 28 January 1920. The next three years were fought over that map." } },

  { date: { tr: "Aralık 1919", en: "December 1919" }, title: { tr: "Karargâh nerede olacak", en: "Where to make headquarters" }, photo: "ankara1919",
    text: { tr: "Hareketin İngiliz donanmasından uzak ve cephelere demiryoluyla bağlı bir merkeze ihtiyacı var.", en: "The movement needs a base out of reach of the British fleet and linked by rail to the fronts." },
    options: [
      { t: { tr: "Ankara", en: "Ankara" }, d: { tr: "Anadolu'nun ortası, batıya demiryolu", en: "Central Anatolia, a railway to the west" }, ok: true, fx: { army: 5, people: 10 },
        r: { tr: "27 Aralık 1919'da Ankaralılar sizi coşkuyla karşılıyor. Küçük bozkır kasabası ülkenin kalbi oluyor.", en: "On 27 December 1919 crowds in Ankara greet you. A small steppe town becomes the heart of the country." } },
      { t: { tr: "Sivas'ta kal", en: "Stay in Sivas" }, d: { tr: "Düşmandan uzak", en: "Far from the enemy" }, fx: { army: -10, morale: -5 },
        r: { tr: "Batı cephesiyle haberleşme haftalar sürüyor. Sonunda yine Ankara'ya taşınıyorsunuz, ama geç.", en: "Messages to the western front take weeks. You move to Ankara in the end, but late." } },
      { t: { tr: "Meclisin açılışı için İstanbul'a dön", en: "Return to Istanbul for the opening of parliament" }, d: { tr: "Siyasetin yakınında ol", en: "Be close to politics" }, fatal: true,
        r: { tr: "16 Mart 1920'de İngilizler Meclis-i Mebusan'ı basıp milletvekillerini tutukluyor. Malta'ya sürülüyorsunuz.", en: "On 16 March 1920 the British raid the parliament and arrest the deputies. You are exiled to Malta." } },
    ],
    after: { nat: ["ankara", "polatli"] },
    history: { tr: "Mustafa Kemal 27 Aralık 1919'da Ankara'ya geldi. Üç ay sonra, 16 Mart 1920'de İstanbul resmen işgal edildi ve milletvekilleri ona katılmak için Ankara'ya kaçtı.", en: "Mustafa Kemal reached Ankara on 27 December 1919. Three months later, on 16 March 1920, Istanbul was formally occupied and deputies fled to join him." } },

  { date: { tr: "Nisan 1920", en: "April 1920" }, title: { tr: "Millî irade", en: "The nation's own government" }, photo: "tbmm",
    text: { tr: "Meclis-i Mebusan dağıtıldı. Milletvekilleri Ankara'ya ulaşıyor. Şeyhülislam sizi asi ilan etti.", en: "The Ottoman parliament has been dissolved. Deputies are reaching Ankara. The Sultan's chief cleric has declared you a rebel." },
    options: [
      { t: { tr: "Türkiye Büyük Millet Meclisi'ni aç", en: "Open the Grand National Assembly" }, d: { tr: "Egemenlik milletindir", en: "Sovereignty belongs to the nation" }, ok: true, fx: { people: 20, morale: 10 },
        r: { tr: "23 Nisan 1920'de Ankara'da TBMM açılıyor. Meclis başkanı seçiliyorsunuz.", en: "On 23 April 1920 the Grand National Assembly opens in Ankara. You are elected its president." } },
      { t: { tr: "Kendini tek başına yönetici ilan et", en: "Declare yourself sole ruler" }, d: { tr: "Savaş diktatörlük ister", en: "War demands a dictator" }, fx: { people: -20, morale: -5 },
        r: { tr: "Pek çok destekçi yüz çeviriyor. Güveni geri kazanmak için yine de bir meclis toplamak zorunda kalıyorsunuz.", en: "Many supporters turn away. You have to convene an assembly anyway to win back their trust." } },
    ],
    after: { nat: ["trabzon", "erzurum", "sivas", "diyarbakir", "van", "eskisehir", "kutahya", "afyon"], greece: ["balikesir", "bursa", "usak", "edirne"] },
    event: { tr: "1920 yazında Yunanlar saldırıyor: Balıkesir, Bursa, Uşak ve Edirne düşüyor. 10 Ağustos'ta padişah hükûmeti ülkeyi bölen Sevr Antlaşması'nı imzalıyor.", en: "In summer 1920 the Greeks attack: Balıkesir, Bursa, Uşak and Edirne fall. On 10 August the Sultan's government signs the Treaty of Sèvres, which partitions the country." },
    history: { tr: "23 Nisan bugün Ulusal Egemenlik ve Çocuk Bayramı'dır. TBMM, 1920 tarihli Sevr Antlaşması'nı hiçbir zaman tanımadı.", en: "23 April is now National Sovereignty and Children's Day. The Assembly never recognised the 1920 Treaty of Sèvres." } },

  { date: { tr: "1920", en: "1920" }, title: { tr: "Güney Cephesi", en: "The southern front" }, type: "map",
    text: { tr: "Fransızlar Çukurova'yı tutuyor. Yerel kuvvetler ayaklanmaya hazır. Yardımı nereye göndermeli? İki şehri kurtarın.", en: "The French hold Cilicia. Local fighters are ready to rise. Where should help go? Liberate two cities." },
    need: ["maras", "urfa"],
    targets: {
      maras: { r: { tr: "22 gün sokak çatışması. 12 Şubat 1920'de Fransız garnizonu Maraş'tan çekiliyor.", en: "22 days of street fighting. On 12 February 1920 the French garrison leaves Maraş." }, fx: { morale: 10, army: -5 } },
      urfa:  { r: { tr: "Garnizon kuşatılıyor. 11 Nisan 1920'de Fransızlar Urfa'yı terk ediyor.", en: "The garrison is besieged. On 11 April 1920 the French abandon Urfa." }, fx: { morale: 5, people: 5 } },
      antep: { r: { tr: "Kahramanca savunma 10 ay sürüyor, ama Şubat 1921'de aç kalan şehir teslim oluyor. Ancak antlaşmayla geri dönecek.", en: "A heroic defence lasts ten months, but in February 1921 the starving city surrenders. It will only return by treaty." }, fx: { army: -10, morale: 5 } },
      adana: { r: { tr: "Adana, topçusu ve zırhlı trenleriyle Fransızların ana üssü. Saldırı ağır kayıplarla püskürtülüyor.", en: "Adana is the main French base, with artillery and armoured trains. The attack is thrown back with heavy losses." }, fx: { army: -15, morale: -10 } },
    },
    history: { tr: "Güney çoğunlukla yerel Kuva-yi Milliye tarafından kurtarıldı. Direnişleri için şehirler unvan aldı: Kahramanmaraş, Gaziantep, Şanlıurfa.", en: "The south was freed mostly by local militias. The cities earned honorary titles for their resistance: Kahramanmaraş, Gaziantep, Şanlıurfa." } },

  { date: { tr: "Sonbahar 1920", en: "Autumn 1920" }, title: { tr: "Doğu Cephesi", en: "The eastern front" }, type: "map", photo: "karabekir",
    text: { tr: "Ermenistan Erzurum'a kadar toprak talep ediyor. Kâzım Karabekir'in 15. Kolordusu ilerlemeye hazır. Hedefi seçin.", en: "Armenia claims land as far as Erzurum. Kâzım Karabekir's XV Corps is ready to advance. Pick the target." },
    need: ["kars"],
    targets: {
      kars:    { r: { tr: "29 Eylül'de Sarıkamış, 30 Ekim'de Kars Kalesi alınıyor. 2–3 Aralık'ta Gümrü Antlaşması imzalanıyor.", en: "Sarıkamış falls on 29 September and the fortress of Kars on 30 October. The Treaty of Gyumri is signed on 2–3 December." }, fx: { army: 10, morale: 15 } },
      ardahan: { r: { tr: "Ardahan Gürcistan'ın elinde. Bir komşuyla daha savaşmak gücü dağıtıyor, birlik geri çekiliyor.", en: "Ardahan is held by Georgia. A war with yet another neighbour spreads your forces thin, and the unit pulls back." }, fx: { army: -10, people: -5 } },
    },
    history: { tr: "Doğudaki zafer, birlikleri batı cephesine kaydırmayı ve Sovyet yardımının yolunu açtı.", en: "Victory in the east freed troops for the western front and opened the route for Soviet aid." } },

  { date: { tr: "Ocak 1921", en: "January 1921" }, title: { tr: "Milis mi, ordu mu", en: "Militia or army" }, photo: "ethem",
    text: { tr: "Çerkez Ethem'in kuvvetleri Yunanlara karşı yiğitçe savaştı, ama emir dinlemiyor. Ethem «Kuvve-i Seyyare»sinin bağımsız kalmasını istiyor.", en: "Çerkez Ethem's bands fought bravely against the Greeks, but they ignore orders. Ethem wants his \"mobile forces\" to stay independent." },
    options: [
      { t: { tr: "Bütün birlikleri düzenli orduya kat", en: "Fold every band into the regular army" }, d: { tr: "Tek komuta", en: "One chain of command" }, ok: true, fx: { army: 10, morale: 5 },
        r: { tr: "Ethem isyan edip Yunanlara geçiyor, ama askerlerinin çoğu orduda kalıyor. Cephe disipline kavuşuyor.", en: "Ethem rebels and goes over to the Greeks, but most of his men stay with the army. The front gains discipline." } },
      { t: { tr: "Birlikleri bağımsız bırak", en: "Leave the bands independent" }, d: { tr: "Kahramanlarla bozuşma", en: "Don't fall out with heroes" }, fx: { army: -10, morale: -10 },
        r: { tr: "Milisler köyleri yağmalıyor ve dağınık hareket ediyor. Yine de dağıtmak zorunda kalıyorsunuz, zaman kaybederek.", en: "The bands loot villages and fight on their own. You have to disband them anyway, and you lose time doing it." } },
    ],
    history: { tr: "Ethem isyanı Ocak 1921'de bastırıldı. İsmet Paşa'nın düzenli ordusu ilk sınavını hemen ardından verdi.", en: "Ethem's revolt was put down in January 1921. İsmet Pasha's regular army faced its first test straight after." } },

  { date: { tr: "Ocak – Nisan 1921", en: "Jan – Apr 1921" }, title: { tr: "İnönü", en: "İnönü" }, type: "map", photo: "inonu",
    text: { tr: "Yunan ordusu Bursa'dan Eskişehir'e ilerliyor. Elinizde genç bir düzenli ordu var. Düşmanı nerede karşılamalı?", en: "The Greek army advances from Bursa towards Eskişehir. You have a young regular army. Where do you meet the enemy?" },
    need: ["eskisehir"],
    targets: {
      eskisehir: { r: { tr: "İsmet Paşa İnönü mevzilerini tutuyor. 6–11 Ocak'ta ve yeniden 23 Mart – 1 Nisan'da Yunanlar geri püskürtülüyor.", en: "İsmet Pasha holds the line at İnönü. On 6–11 January and again on 23 March – 1 April the Greeks are thrown back." }, fx: { morale: 20, people: 10, army: -5 } },
      bursa:     { r: { tr: "Tahkimli Bursa'ya saldırı genç ordunun gücünü aşıyor. Kayıplar ağır.", en: "Storming fortified Bursa is beyond the young army. Losses are heavy." }, fx: { army: -15, morale: -10 } },
      izmir:     { r: { tr: "İzmir 400 kilometre ötede, işgal altındaki topraklarda. Kol yolda takılıp kalıyor.", en: "İzmir is 400 kilometres away across occupied land. The column bogs down on the way." }, fx: { army: -15, morale: -5 } },
    },
    after: { greece: ["afyon"] },
    event: { tr: "İkinci taarruz sırasında Yunanlar Afyon'u alıyor.", en: "During the second offensive the Greeks take Afyon." },
    history: { tr: "İnönü zaferleri Fransa ve İtalya'yı Ankara'yı ciddiye almaya ikna etti. Cephe komutanı daha sonra İnönü soyadını aldı.", en: "The İnönü victories convinced France and Italy to take Ankara seriously. The front commander later took İnönü as his surname." } },

  { date: { tr: "Mart 1921", en: "March 1921" }, title: { tr: "Moskova ile antlaşma", en: "A treaty with Moscow" }, photo: "moscow",
    text: { tr: "Sovyet Rusya altın ve silah vermeye hazır, ama Kafkasya'da sınırın çizilmesini istiyor. Batum Gürcistan'da kalmalı.", en: "Soviet Russia is ready to send gold and weapons but wants the Caucasus border settled. Batumi must stay with Georgia." },
    options: [
      { t: { tr: "İmzala: Batum Gürcistan'a, Kars ve Ardahan Türkiye'ye", en: "Sign: Batumi to Georgia, Kars and Ardahan to Turkey" }, d: { tr: "Yardım limandan önemli", en: "Aid matters more than a port" }, ok: true, fx: { army: 15, people: 5 },
        r: { tr: "16 Mart 1921'de Moskova Antlaşması imzalanıyor. Trabzon üzerinden tüfek, makineli tüfek ve altın geliyor.", en: "The Treaty of Moscow is signed on 16 March 1921. Rifles, machine guns and gold arrive through Trabzon." } },
      { t: { tr: "Savaş pahasına da olsa Batum'u iste", en: "Demand Batumi, even at the cost of war" }, d: { tr: "Bir adım geri yok", en: "Not one step back" }, fx: { army: -10, people: -10 },
        r: { tr: "Görüşmeler kopuyor, birlikler Kafkasya'da bekliyor. Bir ay sonra aynı metni imzalıyorsunuz.", en: "Talks break down and troops sit idle in the Caucasus. A month later you sign the same text." } },
    ],
    after: { nat: ["ardahan"] },
    history: { tr: "Doğu sınırı 13 Ekim 1921 tarihli Kars Antlaşması ile kesinleşti ve bugüne dek neredeyse hiç değişmedi.", en: "The eastern border was fixed by the Treaty of Kars on 13 October 1921 and has barely changed since." } },

  { date: { tr: "Temmuz 1921", en: "July 1921" }, title: { tr: "Geri çekilme", en: "The retreat" },
    text: { tr: "Yunanlar 100 bin asker topladı ve Kütahya'da cepheyi yardı. Eskişehir tehlikede. Ordu yorgun.", en: "The Greeks have massed 100,000 men and broken the front at Kütahya. Eskişehir is threatened. The army is exhausted." },
    options: [
      { t: { tr: "Orduyu Sakarya Nehri'nin doğusuna çek", en: "Pull the army back behind the Sakarya river" }, d: { tr: "Toprak ver, orduyu koru", en: "Give up ground, save the army" }, ok: true, fx: { morale: -5, army: 10 },
        r: { tr: "Ordu düzenli biçimde 200 km doğuya çekiliyor. Ankara'da homurdanmalar var, ama birlikler sağlam.", en: "The army falls back 200 km east in good order. Ankara grumbles, but the units are intact." } },
      { t: { tr: "Eskişehir'i ne pahasına olursa olsun tut", en: "Hold Eskişehir at any cost" }, d: { tr: "Bir karış toprak verme", en: "Not an inch of ground" }, fx: { army: -25, morale: -10 },
        r: { tr: "Kuşatılan tümenler yok oluyor. Kalanlar yine de Sakarya'nın gerisine çekiliyor.", en: "The encircled divisions are destroyed. The survivors fall back behind the Sakarya anyway." } },
    ],
    after: { greece: ["kutahya", "eskisehir"] },
    history: { tr: "Geri çekilme kararı Meclis'te fırtına kopardı. 5 Ağustos 1921'de TBMM, Mustafa Kemal'i olağanüstü yetkilerle Başkomutan atadı.", en: "The decision to retreat caused uproar in the Assembly. On 5 August 1921 it appointed Mustafa Kemal Commander-in-Chief with emergency powers." } },

  { date: { tr: "Ağustos 1921", en: "August 1921" }, title: { tr: "Her şey cephe için", en: "Everything for the front" },
    text: { tr: "Artık Başkomutansınız. Ordunun her şeyi eksik: kaput, çarık, at, ekmek.", en: "You are now Commander-in-Chief. The army lacks everything: coats, boots, horses, bread." },
    options: [
      { t: { tr: "Tekâlif-i Milliye emirlerini yayımla", en: "Issue the National Obligations orders (Tekâlif-i Milliye)" }, d: { tr: "Her aile elindekinin bir kısmını orduya verir", en: "Every household gives part of its stores to the army" }, ok: true, fx: { army: 20, people: -5 },
        r: { tr: "Kadınlar kağnılarla cepheye cephane taşıyor. Ordu ülkedeki kumaşın ve derinin yüzde 40'ını alıyor.", en: "Women haul shells to the front on ox carts. The army receives 40% of the country's cloth and leather." } },
      { t: { tr: "Meclisin oylamasını bekle", en: "Wait for the Assembly to vote" }, d: { tr: "Halka yük olma", en: "Don't burden the people" }, fx: { army: -10, morale: -10 },
        r: { tr: "Tartışmalar haftalarca sürüyor. Askerler düşmanı yalınayak karşılıyor.", en: "The debate drags on for weeks. The soldiers meet the enemy barefoot." } },
    ],
    history: { tr: "Tekâlif-i Milliye emirleri 7–8 Ağustos 1921'de yayımlandı. Kağnıyla cephane taşıyan kadın, savaşın simgesi oldu.", en: "The National Obligations orders were issued on 7–8 August 1921. The woman hauling ammunition by ox cart became a symbol of the war." } },

  { date: { tr: "23 Ağustos 1921", en: "23 August 1921" }, title: { tr: "Sakarya", en: "Sakarya" }, photo: "sakarya",
    text: { tr: "Yunan ordusu Ankara üzerine yürüyor. Cephe nehir boyunca 100 kilometre uzanıyor. Savunmayı nasıl kurmalı?", en: "The Greek army marches on Ankara. The front stretches 100 kilometres along the river. How do you organise the defence?" },
    options: [
      { t: { tr: "«Hattı müdafaa yoktur, sathı müdafaa vardır»", en: "\"There is no line of defence, only a surface of defence\"" }, d: { tr: "Mevzi ver, ama her yerden karşı saldırıya geç", en: "Yield positions but counter-attack from everywhere" }, ok: true, fx: { morale: 25, army: -10, people: 10 },
        r: { tr: "22 gün süren muharebe. Yunanlar tükeniyor ve 13 Eylül'de Sakarya'nın batısına çekiliyor.", en: "22 days of battle. The Greeks wear themselves out and on 13 September retreat west of the Sakarya." } },
      { t: { tr: "Katı hat savunması: her siperi tut", en: "A rigid line: hold every trench" }, d: { tr: "Klasik savunma", en: "Textbook defence" }, fx: { army: -25, morale: -10 },
        r: { tr: "Tek bir noktadaki yarılma bütün cepheyi çökertiyor. Savunmayı yolda yeniden kuruyor, Ankara'yı ağır kayıplarla tutuyorsunuz.", en: "A breach at one point collapses the whole line. You rebuild the defence on the move and hold Ankara at a terrible cost." } },
    ],
    quote: { q: { tr: "Hattı müdafaa yoktur, sathı müdafaa vardır. O satıh bütün vatandır.", en: "There is no line of defence, only a surface of defence. That surface is the whole homeland." }, by: { tr: "Mustafa Kemal, Sakarya, 1921", en: "Mustafa Kemal, Sakarya, 1921" } },
    history: { tr: "Sakarya Meydan Muharebesi savaşın dönüm noktasıdır. 19 Eylül 1921'de TBMM, Mustafa Kemal'e Mareşal rütbesi ve Gazi unvanını verdi.", en: "The Battle of Sakarya was the turning point of the war. On 19 September 1921 the Assembly made Mustafa Kemal a Marshal and gave him the title Gazi." } },

  { date: { tr: "Ekim 1921", en: "October 1921" }, title: { tr: "Fransa ile barış", en: "Peace with France" },
    text: { tr: "Sakarya'dan sonra Fransa çıkış yolu arıyor. Çukurova'yı geri vermeye hazır, ama İskenderun'u (Hatay) elinde tutmak istiyor.", en: "After Sakarya, France wants a way out. It will return Cilicia but wants to keep Alexandretta (Hatay)." },
    options: [
      { t: { tr: "Ankara Antlaşması'nı imzala", en: "Sign the Treaty of Ankara" }, d: { tr: "Güneyi savaşsız al, Hatay'ı sonra", en: "Recover the south without war, Hatay later" }, ok: true, fx: { army: 15, people: 10 },
        r: { tr: "20 Ekim 1921'de antlaşma imzalanıyor. Fransızlar silahlarını bırakıyor. İtalya Antalya'dan zaten çekildi.", en: "The treaty is signed on 20 October 1921. The French leave their weapons behind. Italy has already left Antalya." } },
      { t: { tr: "Bütün güney için savaş", en: "Fight for the whole south at once" }, d: { tr: "Hatay da bizim", en: "Hatay is ours too" }, fx: { army: -15, morale: -5 },
        r: { tr: "İki cephe orduyu tüketiyor. Birkaç ay sonra aynı şartları kabul ediyorsunuz.", en: "Two fronts drain the army. A few months later you accept the same terms." } },
    ],

// Gains are halved so a long good streak does not make later mistakes free; losses hit in full.

function buildMap() {
  const svg = $("map");
  const g = el("g", { class: "grid" }, svg);
  for (let lon = 26; lon <= 45; lon += 2) { const [x] = P([lon, 0]); el("line", { x1: x, y1: 0, x2: x, y2: 470 }, g); }
  for (let lat = 36; lat <= 42; lat += 1) { const [, y] = P([0, lat]); el("line", { x1: 0, y1: y, x2: 1000, y2: y }, g); }
  for (const poly of [ANATOLIA, THRACE]) el("polygon", { class: "land", points: poly.map((p) => P(p).join(",")).join(" ") }, svg);
  FOREIGN.forEach(([c, x, y], i) => el("text", { class: c, x, y, id: "f-" + i }, svg));
  for (const id in REGIONS) {
    const r = REGIONS[id]; const [x, y] = P(r.ll);
    const node = el("g", { class: "node", id: "n-" + id, tabindex: 0, role: "button" }, svg);
    el("circle", { class: "ring", cx: x, cy: y, r: 13 }, node);
    el("circle", { class: "dot", cx: x, cy: y, r: 9 }, node);
    const pos = LABEL_POS[id] || "r";
    const [dx, dy, anchor] = { r: [13, 4, "start"], l: [-13, 4, "end"], t: [0, -15, "middle"], b: [0, 25, "middle"] }[pos];
    el("text", { x: x + dx, y: y + dy, "text-anchor": anchor }, node);
    node.addEventListener("click", () => clickRegion(id));
    node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); clickRegion(id); } });
  }
}

function labelMap() {

  for (const id in REGIONS) {

function paintMap() {
  const ch = CHAPTERS[S.ch];
  const targets = !S.over && S.phase === "ask" && ch.type === "map" ? Object.keys(ch.targets).filter((x) => !S.taken.includes(x)) : [];
  for (const id in REGIONS) {
    const node = $("n-" + id);
    node.querySelector(".dot").setAttribute("fill", SIDES[S.owner[id]].c);
    node.classList.toggle("target", targets.includes(id));
    node.classList.toggle("dim", targets.length > 0 && !targets.includes(id));
  }
}

function showInfo() {
  if (!infoId) { $("info").textContent = t(UI.infoDefault); return; }
  const r = REGIONS[infoId];
  $("info").innerHTML = `<b>${tx(r.n)}</b> · ${tx(SIDES[S.owner[infoId]].n)}<br>${tx(r.note)}`;
}
function clickRegion(id) {
  const ch = CHAPTERS[S.ch];
  if (!S.over && S.phase === "ask" && ch.type === "map" && ch.targets[id] && !S.taken.includes(id)) return pickTarget(id);
  infoId = id; showInfo();
}

/* ---------- Flow ---------- */
function choose(i) {
  const ch = CHAPTERS[S.ch]; const o = ch.options[i];
  if (o.ok) S.good++; else S.bad++;
  applyFx(o.fx);
  S.last = { ok: !!o.ok, r: o.r, fx: o.fx || {} };
  if (o.fatal) { S.over = true; S.why = o.r; return render(); }
  applyAfter(ch.after);
  S.phase = "result";
  if (dead()) S.over = true;
  render();
}

function pickTarget(id) {
  const ch = CHAPTERS[S.ch]; const tg = ch.targets[id]; const ok = ch.need.includes(id);
  S.taken.push(id);
  applyFx(tg.fx);
  if (ok) S.owner[id] = "nat"; else S.bad++;
  const left = ch.need.filter((n) => !S.taken.includes(n));
  S.last = { ok, r: tg.r, fx: tg.fx || {}, place: id, left: left.length };
  if (dead()) { S.over = true; return render(); }
  if (left.length === 0) { S.good++; applyAfter(ch.after); S.phase = "result"; }
  else S.phase = "step";
  render();
}

function next() {
  if (S.phase === "intro" || S.phase === "step") { S.phase = "ask"; return render(); }
  const ch = CHAPTERS[S.ch];
  if (ch.final) { S.over = true; S.won = true; S.owner.hatay = "nat"; return render(); }
  S.ch++; S.taken = []; S.phase = "ask"; S.last = null;
  render();
}

function restart() { S = fresh(); infoId = null; render(); }

const imgCache = {};
function loadImg(src) {

function drawFlag(ctx, cx, cy, h) {
  // Turkish flag proportions: crescent outer circle 0.5h, inner 0.4h offset 0.0625h, star 0.25h diameter
  // Cut the inner circle out instead of painting it red, so whatever is behind (gradient, photo) shows through
  const off = document.createElement("canvas"); off.width = ctx.canvas.width; off.height = ctx.canvas.height;
  const o = off.getContext("2d");
  o.fillStyle = "#fff";
  o.beginPath(); o.arc(cx, cy, h * 0.25, 0, Math.PI * 2); o.fill();
  o.globalCompositeOperation = "destination-out";
  o.beginPath(); o.arc(cx + h * 0.0625, cy, h * 0.2, 0, Math.PI * 2); o.fill();
  ctx.drawImage(off, 0, 0);
  const sx = cx + h * 0.0625 + h * 0.2 + h * 0.0333 + h * 0.125 - h * 0.125 * 0.19, sR = h * 0.125, sr = sR * 0.382;
  ctx.fillStyle = "#fff"; ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = Math.PI + (k * Math.PI) / 5, rr = k % 2 ? sr : sR;
    ctx.lineTo(sx + rr * Math.cos(a), cy + rr * Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
}
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = ""; const lines = [];
  for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line); lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh)); return lines.length;
}
async function makeCard() {

  const portrait = await loadImg(PHOTOS.portrait.f).catch(() => null);

  // question

  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  wrapText(ctx, t(UI.cardQ), 80, 380, 560, 44);
  // rank

  ctx.fillText(t(UI.cardRank), 80, 640);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  ctx.fillStyle = "#fff";

  ctx.fillText(rn, 72, 640 + size * 0.95);

  ctx.font = "italic 400 30px 'PT Serif', Georgia, serif"; ctx.fillStyle = "rgba(255,255,255,.88)";

  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, H - 96, W, 96);
  ctx.fillStyle = "#fff"; ctx.font = "700 28px 'PT Sans Narrow', 'Arial Narrow', sans-serif";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  const foot = t(UI.cardFoot).toLocaleUpperCase(LOCALE[LANG]);

  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

}

    if (navigator.share) {
      nb.hidden = false;
      nb.onclick = async () => {
        const text = $("share-text").textContent;
        const data = navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text, url: GAME_URL };
        try { await navigator.share(data); $("status").textContent = t(UI.shared); } catch (e) {}
      };
    }
    return;
  }
  const downloads = await (window.claude?.use?.("downloads") ?? null);
  if (!downloads) { btn.hidden = true; $("status").textContent = t(UI.noSave); return; }
  btn.hidden = false;
  btn.onclick = async () => {
    try { await downloads.save({ filename, data: cardBlob }); $("status").textContent = t(UI.saved); }
    catch (e) { $("status").textContent = e && e.code === "declined" ? t(UI.declined) : t(UI.noSave); }
  };
}

function shareLinks(text) {
  const u = encodeURIComponent(GAME_URL), tx_ = encodeURIComponent(text);
  const links = [
    ["X", `https://twitter.com/intent/tweet?text=${tx_}&url=${u}`],
    ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${u}`],
    ["WhatsApp", `https://wa.me/?text=${encodeURIComponent(text + " " + GAME_URL)}`],
    ["Telegram", `https://t.me/share/url?url=${u}&text=${tx_}`],
  ];
  return `<div class="social"><span>${tx(UI.shareOn)}</span>${links.map(([n, h]) => `<a href="${h}" target="_blank" rel="noopener">${n}</a>`).join("")}</div>`;
}

/* ---------- Render ---------- */
function renderChrome() {
  document.documentElement.lang = LANG;
  $("sub").textContent = t(UI.sub);
  for (const k of ["army", "morale", "people"]) $("l-" + k).textContent = t(UI[k]);
  for (const l of ["tr", "en", "ru"]) $("lang-" + l).setAttribute("aria-pressed", LANG === l);
  labelMap(); showInfo();
}
function renderStats() {
  $("date").textContent = t(CHAPTERS[S.ch].date);
  for (const k of ["army", "morale", "people"]) {
    $("v-" + k).textContent = S.stats[k];
    $("b-" + k).querySelector("i").style.width = S.stats[k] + "%";
    $("b-" + k).classList.toggle("low", S.stats[k] < 20);
  }
}
function fxChips(fx) {
  return Object.entries(fx).map(([k, v]) => [k, gain(v)]).filter(([, v]) => v).map(([k, v]) => `<span class="chip ${v > 0 ? "up" : "down"}">${tx(UI[k])} ${v > 0 ? "+" : ""}${v}</span>`).join("");
}
function figure(key) {
  const p = PHOTOS[key]; if (!p) return "";
  const credit = `${t(UI.photo)}: ${p.by ? esc(p.by) : t(UI.unknown)} · ${p.lic === "pd" ? t(UI.pd) : esc(p.lic)} · <a href="${p.page}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
  return `<figure class="${p.tall ? "tall" : ""}"><img src="${p.f}" alt="${tx(p.cap)}" loading="lazy"><figcaption>${tx(p.cap)}<br>${credit}</figcaption></figure>`;
}

function render() {
  renderStats(); paintMap();
  const sheet = $("sheet");
  if (S.phase === "intro") return renderIntro();
  if (S.over) return S.won ? renderVictory() : renderDefeat();

  const ch = CHAPTERS[S.ch];
  const prog = `<div class="progress">${CHAPTERS.map((_, i) => `<i class="${i < S.ch || (i === S.ch && S.phase === "result") ? "done" : ""}"></i>`).join("")}</div>`;
  let html = `${prog}<div class="eyebrow"><span>${esc(fmt(t(UI.chapter), { n: S.ch + 1, total: CHAPTERS.length }))}</span><span>${tx(ch.date)}</span></div><h2>${tx(ch.title)}</h2>`;

  if (S.phase === "ask") {
    html += `<p>${tx(ch.text)}</p>`;
    if (ch.type === "map") {
      const open = Object.keys(ch.targets).filter((x) => !S.taken.includes(x));
      const done = ch.need.filter((n) => S.taken.includes(n)).length;
      html += `<p class="hint">${esc(fmt(t(UI.targets), { d: done, total: ch.need.length }))}</p>
        <div class="opts">${open.map((x) => `<button class="opt" data-t="${x}">${tx(UI.attack)}${tx(REGIONS[x].n)}<small>${tx(SIDES[S.owner[x]].n)}</small></button>`).join("")}</div>`;
    } else {
      html += `<div class="opts">${ch.options.map((o, i) => `<button class="opt" data-i="${i}">${tx(o.t)}<small>${tx(o.d)}</small></button>`).join("")}</div>`;
    }
  } else {
    const L = S.last;
    html += `<div class="verdict ${L.ok ? "ok" : "no"}">${tx(L.ok ? UI.ok : UI.bad)}${L.place ? " · " + tx(REGIONS[L.place].n) : ""}</div>
      <p>${tx(L.r)}</p><div class="chips">${fxChips(L.fx)}</div>`;
    if (S.phase === "step") {
      html += `<p class="hint">${L.ok ? esc(fmt(t(UI.left), { n: L.left })) : tx(UI.other)}</p><div class="row"><button class="go" id="next">${tx(UI.toMap)}</button></div>`;
    } else {
      if (ch.event) html += `<p class="hint">${tx(ch.event)}</p>`;
      if (ch.quote) html += `<p class="quote">«${tx(ch.quote.q)}»<small>${tx(ch.quote.by)}</small></p>`;
      html += `<div class="history"><h3>${tx(UI.history)}</h3>${figure(ch.photo)}<p>${tx(ch.history)}</p></div>
        <div class="row"><button class="go" id="next">${tx(ch.final ? UI.results : UI.next)}</button></div>`;
    }
  }
  sheet.innerHTML = html;
  wire();
}

function renderIntro() {
  $("sheet").innerHTML = `
    <div class="eyebrow"><span>1919–1923</span><span>${tx(CHAPTERS[0].date)}</span></div>
    <h2>Gazi</h2>
    <p>${tx(UI.intro)}</p>
    <p class="quote">«${tx(UI.introQuote)}»<small>${tx(UI.introBy)}</small></p>
    ${figure("gallipoli")}
    <div class="row"><button class="go" id="next">${tx(UI.start)}</button></div>`;
  wire();
}

const promo = () => `<div class="promo"><p>${tx(UI.moreQ)}</p><a class="go" href="https://thousands.life" target="_blank" rel="noopener">${tx(UI.moreBtn)} →</a></div>`;

function renderDefeat() {
  const k = dead();
  const why = S.why ? t(S.why) : t(UI.why[k] || UI.why.army);
  $("sheet").innerHTML = `
    <div class="eyebrow"><span>${tx(UI.defeat)}</span><span>${tx(CHAPTERS[S.ch].date)}</span></div>
    <h2>${tx(UI.defeatTitle)}</h2>
    <p>${esc(why)}</p>
    <p class="hint">${tx(UI.defeatHint)}</p>
    <div class="row"><button class="go" id="restart">${tx(UI.restart)}</button></div>
    ${promo()}`;
  wire();
}

function renderVictory() {
  const rank = rankOf();
  const total = S.stats.army + S.stats.morale + S.stats.people;
  const share = fmt(t(UI.shareText), { r: t(rank.n), c: S.good, n: S.good + S.bad });
  $("sheet").innerHTML = `
    <div class="eyebrow"><span>${tx(UI.final)}</span><span>29.10.1923</span></div>
    <h2>${esc(fmt(t(UI.rankIs), { r: t(rank.n) }))}</h2>
    <p>${tx(rank.d)}</p>
    <div class="score">
      <div><b>${S.good}</b><span>${tx(UI.correct)}</span></div>
      <div><b>${S.bad}</b><span>${tx(UI.mistakes)}</span></div>
      <div><b>${total}</b><span>${tx(UI.total)}</span></div>
    </div>
    <div class="history"><h3>${tx(UI.cardTitle)}</h3>
      <div class="card" id="card"></div>
      <p id="share-text">${esc(share + " " + GAME_URL)}</p>
      <div class="row"><button class="go" id="save" hidden>${tx(UI.save)}</button><button class="go" id="share-native" hidden>${tx(UI.shareBtn)}</button><button class="ghost" id="copy">${tx(UI.copy)}</button></div>
      ${shareLinks(share)}
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="history"><h3>${tx(UI.epilogue)}</h3><p>${tx(UI.epilogueText)}</p></div>
    <p class="quote">«${tx(UI.motto)}»<small>${tx(UI.mottoBy)}</small></p>
    ${promo()}
    <div class="row"><button class="ghost" id="restart">${tx(UI.again)}</button></div>`;
  wire();
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(share + " " + GAME_URL); $("status").textContent = t(UI.copied); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("share-text")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("status").textContent = t(UI.copyFail); }
  };
  renderCard();
}

function wire() {
  const sheet = $("sheet");
  sheet.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => choose(+b.dataset.i)));
  sheet.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => pickTarget(b.dataset.t)));
  const n = $("next"); if (n) n.onclick = next;
  const r = $("restart"); if (r) r.onclick = restart;
}

function setLang(l) {
  LANG = l; try { localStorage.setItem("gazi-lang", l); } catch (e) {}
  renderChrome(); render();
}
for (const l of ["tr", "en", "ru"]) $("lang-" + l).onclick = () => setLang(l);

buildMap();
const boot = (data) => { S = data && data.S ? data.S : fresh(); renderChrome(); render(); };
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
